
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Login</title>

    <style>
        body {
            background: linear-gradient(135deg, #141e30, #243b55);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background-color: #ffffff;
            padding: 35px;
            width: 320px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            color: white;
            background-color: #6c63ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        label {
            color: #243b55;
            font-weight: bold;
            display: block;
            text-align: left;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #d6d9e0;
            border-radius: 7px;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #6c63ff;
            background-color: #f5f4ff;
        }

        button {
            background-color: #6c63ff;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        button:hover {
            background-color: #483dcb;
        }

        .error {
            color: #e63946;
            background-color: #ffe5e5;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Student Login</h2>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username:</label>
            <input type="text" name="username"
                   placeholder="Enter Username" required>

            <label>Password:</label>
            <input type="password" name="password"
                   placeholder="Enter Password" required>

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
